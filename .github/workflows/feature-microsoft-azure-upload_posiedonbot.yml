name: Deploy PosiedonBot to Azure Container

on:
  push:
    branches:
      - feature/Microsoft-Azure-Upload
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name posiedon

      - name: Build and Push Image to ACR
        run: |
          az acr build --registry posiedon --image discord-bot:${{ github.sha }} .

      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group PosiedonBot_group \
            --name posiedon-bot-instance \
            --image posiedon.azurecr.io/discord-bot:${{ github.sha }} \
            --cpu 1 --memory 1 \
            --restart-policy Always \
            --registry-login-server posiedon.azurecr.io \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --environment-variables DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}